<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Campus Pulse</title>
  <style>
    :root{
      /* Central College branding */
      --primary-red:#CB2026;
      --secondary-red:#990000;
      --tertiary-red:#660000;

      --primary-gray:#CCCCCC;
      --secondary-gray:#666666;
      --tertiary-gray:#333333;

      /* theme mapping */
      --bg:#000000;
      --card:var(--tertiary-gray);
      --text:var(--primary-gray);
      --muted:var(--secondary-gray);
      --accent:var(--primary-red);

      --pad: clamp(18px, 2.5vw, 64px);
      --gap: clamp(14px, 1.5vw, 36px);
      --radius: clamp(14px, 1.2vw, 28px);
      --h1: clamp(48px, 4vw, 120px);
      --h2: clamp(28px, 2vw, 68px);
      --base: clamp(18px, 1.15vw, 44px);
      --li: clamp(18px, 1.25vw, 52px);
      --today: clamp(26px, 2.0vw, 72px);
      --clock: clamp(16px, 1.0vw, 36px);
    }

    *{ box-sizing:border-box; }
    html, body { height:100%; }
    body{
      margin:0; background:var(--bg); color:var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: var(--base);
    }

    .grid{
      height:100vh;
      display:grid;
      gap:var(--gap);
      padding:var(--pad);
      grid-template-columns: 1.55fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      padding: calc(var(--pad) * 0.65);
      overflow:hidden;
      border: 1px solid rgba(204,204,204,.08);
    }

    .hero{
      grid-column: 1 / span 2;
      grid-row: 1 / span 2;
      position:relative;
      padding-bottom: clamp(60px, 5vw, 140px);
    }

    .row{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      gap: 20px;
    }

    h1{ margin:0; font-size:var(--h1); letter-spacing: .2px; color: var(--primary-gray); }
    h2{ margin:0 0 10px; font-size:var(--h2); color:var(--primary-gray); }

    .clock{ font-size:var(--clock); color:var(--muted); white-space:nowrap; }

    .wxpill{
      font-size: var(--clock);
      color: var(--primary-gray);
      padding: .25em .6em;
      border-radius: 999px;
      border: 1px solid rgba(204,204,204,.20);
      background: rgba(255,255,255,.06);
      white-space: nowrap;
    }

    .today{ margin-top: clamp(10px, 1vw, 22px); font-size:var(--today); line-height:1.18; }
    .muted{ color:var(--muted); font-size: clamp(14px, .85vw, 28px); margin-top: 10px; }

    ol{ margin:0; padding-left: 1.2em; }
    li{ margin: clamp(8px, .8vw, 18px) 0; font-size: var(--li); line-height:1.15; }

    .tag{
      display:inline-block;
      font-size: clamp(12px, .75vw, 24px);
      padding: 0.2em 0.6em;
      border-radius:999px;
      background: rgba(203,32,38,.20);
      border: 1px solid rgba(203,32,38,.35);
      margin-left:.5em;
      color: var(--primary-gray);
    }

    .footerbar{
      position:absolute;
      left: calc(var(--pad) * 0.65);
      right: calc(var(--pad) * 0.65);
      bottom: calc(var(--pad) * 0.65);
      padding: clamp(10px, 1vw, 22px);
      border-radius: calc(var(--radius) * 0.85);
      background: rgba(203,32,38,.18);
      border: 2px solid rgba(203,32,38,.35);
      font-size: clamp(18px, 1.2vw, 44px);
    }

    a { color: var(--primary-gray); text-decoration: underline; text-decoration-color: rgba(204,204,204,.35); }
    code { color: var(--primary-gray); }
    .error { white-space: pre-wrap; }
  </style>
</head>

<body>
  <div class="grid">
    <!-- HERO -->
    <section class="card hero">
      <div class="row">
        <h1>Campus Pulse</h1>
        <div style="display:flex; gap:14px; align-items:baseline;">
          <div id="wxPill" class="wxpill">--°</div>
          <div id="clock" class="clock"></div>
        </div>
      </div>

      <div id="today" class="today">Loading…</div>
      <div id="nowNext" class="muted"></div>

      <div class="footerbar" id="countdown"></div>
    </section>

    <!-- ACADEMIC -->
    <section class="card">
      <h2>Next Academic Dates</h2>
      <ol id="academic"></ol>
      <div class="muted">Data source: <code>data/academic.json</code></div>
    </section>

    <!-- CAMPUS EVENTS -->
    <section class="card">
      <h2>Next Campus Events</h2>
      <ol id="events"></ol>
      <div class="muted" id="eventsUpdated"></div>
      <div class="muted">Source: <code>data/events.json</code></div>
    </section>
  </div>

  <script>
    const TZ = "America/Chicago";

    function fmtLong(now){
      const dateStr = new Intl.DateTimeFormat("en-US", {
        timeZone: TZ, weekday:"long", month:"long", day:"numeric", year:"numeric"
      }).format(now);
      const timeStr = new Intl.DateTimeFormat("en-US", {
        timeZone: TZ, hour:"numeric", minute:"2-digit"
      }).format(now);
      return `${dateStr} • ${timeStr}`;
    }

    function fmtDate(d){
      return new Intl.DateTimeFormat("en-US", {
        timeZone: TZ, weekday:"short", month:"short", day:"numeric"
      }).format(d);
    }

    function fmtTime(d){
      return new Intl.DateTimeFormat("en-US", {
        timeZone: TZ, hour:"numeric", minute:"2-digit"
      }).format(d);
    }

    function parseISOish(s){
      if(!s) return null;
      if (s.length === 10) return new Date(`${s}T00:00:00`);
      return new Date(s);
    }

    function daysUntil(d){
      const now = new Date();
      const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const b = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      return Math.round((b - a) / 86400000);
    }

    function setClock(){
      document.getElementById("clock").textContent = fmtLong(new Date());
    }

    async function loadJSON(path){
      const r = await fetch(path + "?v=" + Date.now(), { cache: "no-store" });
      if(!r.ok) throw new Error(`Could not load ${path} (${r.status})`);
      return r.json();
    }

    function renderList(el, htmlItems, max=10){
      el.innerHTML = "";
      htmlItems.slice(0, max).forEach(html => {
        const li = document.createElement("li");
        li.innerHTML = html;
        el.appendChild(li);
      });
    }

    function pickUpcomingAcademic(academic){
      const now = new Date();
      return academic
        .map(e => ({...e, d0: parseISOish(e.start), d1: parseISOish(e.end)}))
        .filter(e => e.d0 && ((e.d1 || e.d0) >= now))
        .sort((a,b) => a.d0 - b.d0);
    }

    async function loadWeather(){
      // Pella, IA coords
      const lat = 41.4081, lon = -92.9163;
      const url =
        `https://api.open-meteo.com/v1/forecast` +
        `?latitude=${lat}&longitude=${lon}` +
        `&current=temperature_2m,weather_code` +
        `&temperature_unit=fahrenheit&timezone=${encodeURIComponent(TZ)}`;

      const r = await fetch(url, { cache: "no-store" });
      if(!r.ok) throw new Error(`Weather fetch failed (${r.status})`);
      const j = await r.json();

      const cur = j.current;
      const temp = Math.round(cur.temperature_2m);

      const code = cur.weather_code;
      const label =
        (code === 0) ? "Clear" :
        ([1,2,3].includes(code)) ? "Cloudy" :
        ([45,48].includes(code)) ? "Fog" :
        ([51,53,55,56,57].includes(code)) ? "Drizzle" :
        ([61,63,65,66,67].includes(code)) ? "Rain" :
        ([71,73,75,77].includes(code)) ? "Snow" :
        ([80,81,82].includes(code)) ? "Showers" :
        ([95,96,99].includes(code)) ? "Storms" :
        "Wx";

      // Keep it compact (no "Pella Weather" label)
      document.getElementById("wxPill").textContent = `${temp}°F • ${label}`;
    }

    (async function main(){
      setClock();
      setInterval(setClock, 15000);

      // Academic
      let academic = [];
      try {
        academic = await loadJSON("data/academic.json");
      } catch (e) {
        document.getElementById("academic").innerHTML =
          `<li class="error">Missing data/academic.json — add it in your repo.</li>`;
      }

      const acadUpcoming = pickUpcomingAcademic(academic);

      renderList(
        document.getElementById("academic"),
        acadUpcoming.map(e => {
          const range = e.end ? `${fmtDate(e.d0)}–${fmtDate(e.d1)}` : fmtDate(e.d0);
          return `<strong>${range}</strong> — ${e.title}`;
        }),
        10
      );

      // Campus events
      let eventsData = null;
      try {
        eventsData = await loadJSON("data/events.json");
        document.getElementById("eventsUpdated").textContent =
          eventsData.updated ? `Updated: ${eventsData.updated}` : "";
      } catch (e) {
        document.getElementById("events").innerHTML =
          `<li class="muted">No events feed found. (Expected data/events.json)</li>`;
      }

      const now = new Date();
      const horizonDays = 30;
      const horizonMs = horizonDays * 86400000;

      const evUpcoming = eventsData ? (eventsData.events || [])
        .map(e => ({ ...e, d: parseISOish(e.start) }))
        .filter(e => e.d && e.d >= now && (e.d - now) <= horizonMs)
        .sort((a,b) => a.d - b.d)
        .slice(0, 12) : [];

      if (evUpcoming.length) {
        renderList(
          document.getElementById("events"),
          evUpcoming.map(e => {
            const when = `${fmtDate(e.d)} • ${fmtTime(e.d)}`;
            const loc = e.location ? ` — <span class="muted">${e.location}</span>` : "";
            const title = e.url
              ? `<a href="${e.url}" target="_blank" rel="noreferrer">${e.title || "Event"}</a>`
              : (e.title || "Event");
            return `<strong>${when}</strong> — ${title}${loc}`;
          }),
          12
        );
      }

      // Hero: next milestone + countdown
      const todayEl = document.getElementById("today");
      const nowNextEl = document.getElementById("nowNext");
      const cdEl = document.getElementById("countdown");

      if (acadUpcoming.length) {
        const next = acadUpcoming[0];
        const n = daysUntil(next.d0);
        todayEl.innerHTML =
          `Next academic milestone:<br><strong>${next.title}</strong><br>` +
          `<span class="muted">${fmtDate(next.d0)}</span>`;
        cdEl.textContent = `${n} day${n===1?"":"s"} until ${next.title}`;
      } else {
        todayEl.textContent = "Add academic dates to data/academic.json";
        cdEl.textContent = "";
      }

      // Ticker: next campus events
      if (evUpcoming.length) {
        const next3 = evUpcoming.slice(0, 3)
          .map(e => `${fmtDate(e.d)} ${fmtTime(e.d)} — ${e.title}`)
          .join("  •  ");
        nowNextEl.textContent = `Next campus events: ${next3}`;
      } else {
        nowNextEl.textContent = `Next campus events: (none in next ${horizonDays} days)`;
      }

      // Weather pill
      try { await loadWeather(); }
      catch(e){
        document.getElementById("wxPill").textContent = "--°";
      }

      // Signage-friendly refresh
      setTimeout(() => location.reload(), 60 * 60 * 1000);
    })().catch(err => {
      document.body.innerHTML =
        `<pre class="error" style="color:#fff;padding:18px">Error:\n${err.stack || err}</pre>`;
    });
  </script>
</body>
</html>
